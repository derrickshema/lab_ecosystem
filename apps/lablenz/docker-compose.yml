# ============================================================
# DOCKER COMPOSE CONFIGURATION
# ============================================================
# Docker Compose lets you define and run multiple containers.
# This file defines the LabLenz application stack:
# - localstack: S3 emulation for file uploads
# - backend: FastAPI server
# - frontend: SvelteKit server
#
# First start the shared database: cd ../../infrastructure && docker compose up -d
# To start everything: docker-compose up
# To rebuild and start: docker-compose up --build
# To stop: docker-compose down
# To stop and remove S3 data: docker-compose down -v
#   (database data lives in the shared infrastructure volume)
# ============================================================

services:
  # PostgreSQL is NOT defined here. It is shared by every app and
  # runs from infrastructure/docker-compose.yml — start that first.
  # It creates lablenz_db and the lab_net network the backend joins.

  # ----------------------------------------------------------
  # LocalStack (S3 Emulation)
  # ----------------------------------------------------------
  # LocalStack emulates AWS services locally.
  # We use it for S3 (file storage) without needing a real AWS account.
  localstack:
    image: localstack/localstack:latest
    container_name: lablenz-localstack
    
    environment:
      # Only run the S3 service
      SERVICES: s3
      # Default region
      AWS_DEFAULT_REGION: us-east-1
    
    ports:
      # LocalStack runs on port 4566
      - "4567:4566"
    
    # Persist S3 data in a volume
    volumes:
      - localstack_data:/var/lib/localstack

  # ----------------------------------------------------------
  # Backend (FastAPI)
  # ----------------------------------------------------------
  backend:
    # Build from the backend directory
    build:
      # Repo root, so the Dockerfile can also copy packages/labcore
      context: ../..
      dockerfile: apps/lablenz/backend/Dockerfile
    
    container_name: lablenz-backend
    
    # Environment variables for the app
    # These override the .env file
    environment:
      # Database connection ('postgres' is the shared server, reached over lab_net)
      DATABASE_URL: postgresql://lablenz_user:lablenz_123@postgres:5432/lablenz_db
      
      # Security (use a real secret in production!)
      SECRET_KEY: your-super-secret-key-change-in-production
      
      # CORS - allow frontend origin
      CORS_ORIGINS: '["http://localhost:3001", "http://frontend:3000"]'
      
      # S3 / LocalStack configuration
      S3_BUCKET_NAME: lablenz-images
      S3_ENDPOINT_URL: http://localstack:4566
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_REGION: us-east-1
      
      # Stripe (set these in .env for real values)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      
      # Email (set these in .env for real values)
      RESEND_API_KEY: ${RESEND_API_KEY:-re_placeholder}
      
      # Frontend URL for email links
      FRONTEND_URL: http://localhost:3001

      DEBUG: "true"
    
    volumes:
      # Mount source code so alembic migrations and code changes are
      # written back to the host filesystem. The venv lives at /opt/venv
      # (not /app) so it is NOT overridden by this mount.
      - ./backend:/app
      # Shared package: edits on the host hot-reload in the container
      - ../../packages/labcore:/packages/labcore

    # Override CMD to enable hot-reload in development.
    # Remove --reload when deploying to production.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app --reload-dir /packages/labcore

    ports:
      - "8001:8000"
    
    # default: reach localstack and the frontend; lab_net: reach postgres
    networks:
      - default
      - lab_net

    # Wait for localstack before starting (postgres is in another
    # compose project, so it can't be listed here)
    depends_on:
      localstack:
        condition: service_started
    
    # Health check using our /health endpoint
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # Frontend (SvelteKit)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    container_name: lablenz-frontend
    
    environment:
      # SvelteKit needs ORIGIN for CSRF protection
      ORIGIN: http://localhost:3001
      
      # Backend API URL (used by SvelteKit server-side code)
      # From frontend container, backend is accessible via service name
      API_BASE_URL: http://backend:8000
      
      # Public API URL (used by browser JavaScript)
      # Browser can't resolve 'backend', so use localhost
      PUBLIC_API_URL: http://localhost:8001
    
    ports:
      - "3001:3000"
    
    # Wait for backend to be healthy
    depends_on:
      backend:
        condition: service_healthy

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
# Named volumes persist data between container restarts.
# Run 'docker-compose down -v' to delete them.
volumes:
  localstack_data:

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
# Created by infrastructure/docker-compose.yml
networks:
  lab_net:
    external: true
