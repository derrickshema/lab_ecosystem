# PostgreSQL is shared across apps and runs from infrastructure/docker-compose.yml.
# Start that first: it creates ehr_db and the lab_net network.

services:
  # LocalStack — emulates AWS S3 locally (no real AWS account needed)
  localstack:
    image: localstack/localstack:latest
    container_name: ehr-localstack
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

  # Backend (FastAPI)
  backend:
    build:
      # Repo root, so the Dockerfile can also copy packages/labcore
      context: ../..
      dockerfile: apps/ehr/backend/Dockerfile
    container_name: ehr-backend
    environment:
      # 'postgres' is the shared server, reached over lab_net
      DATABASE_URL: postgresql+psycopg2://ehr_user:ehr_123@postgres:5432/ehr_db
      SECRET_KEY: your-super-secret-key-change-in-production
      CORS_ORIGINS: '["http://localhost:3000", "http://frontend:3000"]'
      S3_BUCKET_NAME: ehr-uploads
      S3_ENDPOINT_URL: http://localstack:4566
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_REGION: us-east-1
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_placeholder}
      FRONTEND_URL: http://localhost:3000
      DEBUG: "true"
    # Mount source so code changes and alembic migrations sync with the host.
    # The venv lives at /opt/venv, so this mount doesn't hide it.
    volumes:
      - ./backend:/app
      # Shared package: edits on the host hot-reload in the container
      - ../../packages/labcore:/packages/labcore
    # Hot-reload for development; drop --reload in production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app --reload-dir /packages/labcore
    ports:
      - "8000:8000"
    # default: reach localstack and the frontend; lab_net: reach postgres
    networks:
      - default
      - lab_net
    depends_on:
      localstack:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (SvelteKit)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ehr-frontend
    environment:
      ORIGIN: http://localhost:3000
      # Internal: SvelteKit server-side code uses the service name
      API_BASE_URL: http://backend:8000
      # Public: browser JS uses localhost (can't resolve 'backend')
      PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

networks:
  # Created by infrastructure/docker-compose.yml
  lab_net:
    external: true

volumes:
  localstack_data: